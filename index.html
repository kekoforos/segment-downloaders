<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Descarga de segmentos Strava</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">S</span>
      <div class="brand-text">
        <h1>Descarga de segmentos</h1>
        <p class="brand-subtitle">Gestiona y descarga tus GPX de Strava</p>
      </div>
    </div>
    <a
      class="strava-connect-banner"
      href="https://www.strava.com/oauth/authorize?client_id=13731&response_type=code&redirect_uri=https://www.doogal.co.uk/StravaCompleteAuthenticate&approval_prompt=force&scope=read,read_all,profile:write"
      target="_blank"
      rel="noopener noreferrer"
    >
      Connect with Strava
    </a>
  </header>

  <main>
    <section class="add-segment-section" aria-label="Añadir segmento">
      <form id="add-segment-form">
        <label for="segment-id-input">ID de segmento Strava</label>
        <input
          type="text"
          id="segment-id-input"
          name="segmentId"
          placeholder="Ej. 675809"
          autocomplete="off"
        >
        <button type="submit">Añadir</button>
      </form>
      <p id="form-message" class="message" role="alert" aria-live="polite"></p>

      <div class="import-segments">
        <label for="segment-file-input">Importar listado desde archivo .txt (un ID de segmento por línea)</label>
        <input type="file" id="segment-file-input" accept=".txt,text/plain">
      </div>
      <p id="import-message" class="message" role="alert" aria-live="polite"></p>
    </section>

    <section class="segment-list-section" aria-label="Listado de segmentos">
      <div class="segment-list-header">
        <h2>Listado de segmentos</h2>
        <div class="segment-list-header-actions">
          <button type="button" id="remove-all-btn" class="secondary-btn">Eliminar todos</button>
          <button type="button" id="download-all-btn">Descargar todos</button>
        </div>
      </div>
      <p id="list-message" class="message" role="alert" aria-live="polite"></p>
      <ul id="segment-list" class="segment-list"></ul>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
